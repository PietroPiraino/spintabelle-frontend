<div class="rg" role="group" aria-label="Matrice delle 169 mani iniziali">
  @for (cell of cells(); track cell.hand) {
    @if (statica()) {
      <!--
        Variante statica: uno <span> col title nativo al posto del bottone.
        Niente hover, niente output: 169 bottoni in una pagina di lettura
        sarebbero 169 bersagli di tocco senza un'azione dietro.
      -->
      <span
        class="rg__cell rg__cell--statica"
        [class.rg__cell--off]="!cell.reached"
        [style.background]="cell.background"
        [attr.title]="cell.aria"
        [attr.aria-label]="cell.aria"
        role="img"
      ><span class="rg__label">{{ cell.hand }}</span></span>
    } @else {
      <button
        type="button"
        class="rg__cell"
        [class.rg__cell--off]="!cell.reached"
        [class.rg__cell--sel]="cell.hand === selected()"
        [style.background]="cell.background"
        [attr.aria-label]="cell.aria"
        (mouseenter)="handHover.emit(cell.hand)"
        (mouseleave)="onLeave()"
        (focus)="handHover.emit(cell.hand)"
        (blur)="onLeave()"
        (click)="handPick.emit(cell.hand)"
      ><span class="rg__label">{{ cell.hand }}</span></button>
    }
  }
</div>
