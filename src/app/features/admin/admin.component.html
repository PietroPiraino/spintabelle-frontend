<div class="admin-shell">
  <div class="admin-shell__topbar">
    <button
      type="button"
      class="admin-shell__toggle"
      (click)="toggleDrawer()"
      [attr.aria-expanded]="drawerOpen()"
    >
      <app-icon name="chevron-down" [size]="16" />
      Sezioni
    </button>
    <h1 class="admin-shell__title">{{ currentLabel() }}</h1>
  </div>

  <aside class="admin-shell__sidebar" [class.is-open]="drawerOpen()">
    <div class="admin-shell__brand">
      <span class="eyebrow">Backstage</span>
      <strong>Pannello admin</strong>
    </div>

    <nav class="admin-shell__nav" aria-label="Sezioni admin">
      @for (group of nav; track group.id) {
        @if (group.label) {
          <span class="admin-shell__group-label">{{ group.label }}</span>
        }
        @for (item of group.items; track item.path) {
          <!-- ⚠️ Il ramo per il path vuoto (Panoramica) NON è pedanteria:
               `['/admin', '']` serializza in `/admin/` — con la barra finale — e
               il router ci vede un segmento vuoto IN PIÙ da agganciare. Non lo
               aggancia nessuno, quindi si finiva sulla rotta jolly: cliccare
               «Panoramica» nella sidebar portava alla pagina 404 dell'app. Dal
               menù dell'header non si vedeva, perché quello punta a `/admin`
               come stringa e combacia. Difetto presente dal 14/08/2026,
               segnalato dall'owner il 19/08 e pinnato da una spec. -->
          <a
            class="admin-shell__link"
            [routerLink]="item.path ? ['/admin', item.path] : ['/admin']"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: item.path === '' }"
            ariaCurrentWhenActive="page"
          >
            <app-icon [name]="item.icon" [size]="18" />
            <span class="admin-shell__link-label">{{ item.label }}</span>
            @if (item.badge) {
              @if (badgeCount(item.badge); as count) {
                <span class="admin-shell__badge">{{ count }}</span>
              }
            }
            @if (item.soon) {
              <span class="admin-shell__soon">Presto</span>
            }
          </a>
        }
      }
    </nav>
  </aside>

  <div class="admin-shell__main">
    <router-outlet />
  </div>
</div>
