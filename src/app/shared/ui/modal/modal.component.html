<!--
  ⚠️ `(cancel)` è l'evento di Escape, consegnato PRIMA della chiusura: è lì che
  si può fermarla quando c'è del testo non salvato.
  ⚠️ `(close)` NON emette `chiusa`: il ciclo è al contrario — è il chiamante a
  distruggere il componente, e la distruzione chiude il dialog. Emettere anche
  da qui produrrebbe due giri.
-->
<dialog
  #dlg
  class="mo"
  [class.mo--stretta]="taglia() === 'stretta'"
  [class.mo--larga]="taglia() === 'larga'"
  [attr.aria-labelledby]="idTitolo"
  [attr.aria-describedby]="idSottotitolo()"
  (cancel)="onCancel($event)"
  (mousedown)="onGiu($event)"
  (click)="onClic($event)"
>
  <div class="mo__box" tabindex="-1" [attr.aria-busy]="salvando() ? 'true' : null">
    <header class="mo__testa">
      <div class="mo__titoli">
        <h2 [id]="idTitolo" class="mo__titolo">{{ titolo() }}</h2>
        @if (sottotitolo(); as sub) {
          <p [id]="idSottotitolo()" class="mo__sub">{{ sub }}</p>
        }
        <!--
          ⚠️ Se `salvando` toglie Escape e il clic sul fondale, deve DIRE
          perché: un tasto che smette di funzionare senza spiegazione si legge
          come un blocco, e la reazione è premerlo più forte.
        -->
        @if (salvando()) {
          <p class="mo__stato" role="status">Salvataggio in corso…</p>
        }
      </div>
      <button
        type="button"
        class="mo__chiudi"
        aria-label="Chiudi"
        (click)="chiudi()"
      >
        <app-icon name="x" [size]="18" />
      </button>
    </header>

    <div class="mo__corpo">
      <ng-content />
    </div>

    <!--
      Le azioni del form: restano ferme mentre il corpo scorre.

      ⚠️ DENTRO `.mo__box`, mai come fratello sotto il `<dialog>`: il fondale si
      riconosce da `e.target === dialog`, e una fascia appesa direttamente al
      dialog lascerebbe attorno a sé pixel il cui bersaglio è ancora il dialog —
      cioè un clic accanto a «Salva» che chiude la modale.
      ⚠️ Sta PRIMA della riga di conferma, che deve restare l'ultima: è quella
      che ha appena preso il fuoco.
      ⚠️ Il submit del chiamante è qui, quindi FUORI dal suo `<form>`: gli serve
      `form="<id>"`, o il clic non invia niente e non lo segnala nessuno.
    -->
    <footer class="mo__piede">
      <ng-content select="[moPiede]" />
    </footer>

    @if (confermaUscita()) {
      <!--
        ⚠️ Riga IN LINEA e non un secondo <dialog>: due dialog modali
        sovrapposti sono una fila di top-layer da smontare nell'ordine giusto, e
        il progetto non ha mai avuto nemmeno il primo. Qui basta una riga che
        prende il fuoco.
      -->
      <div class="mo__conferma" role="alert">
        <p>Hai modifiche non salvate. Vuoi chiudere e perderle?</p>
        <div class="row mo__conferma-azioni">
          <button
            type="button"
            class="btn btn--ghost btn--sm"
            autofocus
            (click)="resta()"
          >
            Continua a modificare
          </button>
          <button
            type="button"
            class="btn btn--danger btn--sm"
            (click)="chiudi()"
          >
            Chiudi senza salvare
          </button>
        </div>
      </div>
    }
  </div>
</dialog>
